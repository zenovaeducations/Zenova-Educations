<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Zenova | Submission Form</title>

    <link rel="stylesheet" href="submissions.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet">

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header class="top-header">

        <div class="zenova-logo">

            <h1>ZENOVA</h1>

            <span>EDUCATIONS</span>

        </div>

        <button
            type="button"
            class="view-button"
            id="viewButton">

            <i class="ri-eye-line"></i>

            <span>View</span>

        </button>

    </header>


    <!-- MAIN -->

    <main class="main-content">


        <!-- TOTAL -->

        <section class="total-card">

            <div>

                <span>TOTAL SUBMISSIONS</span>

                <strong id="totalSubmissions">
                    0
                </strong>

            </div>

            <div class="total-icon">

                <i class="ri-group-line"></i>

            </div>

        </section>


        <!-- FORM -->

        <section class="form-card">

            <div class="form-heading">

                <span>NEW ENTRY</span>

                <h2>Submit Details</h2>

                <p>
                    Enter the details below and submit.
                </p>

            </div>


            <form id="submissionForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <div class="input-box">

                        <i class="ri-user-line"></i>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter name"
                            autocomplete="off"
                            required>

                    </div>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <div class="input-box">

                        <i class="ri-phone-line"></i>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                            maxlength="10"
                            inputmode="numeric"
                            autocomplete="off"
                            required>

                    </div>

                </div>


                <!-- VILLAGE -->

                <div class="form-group">

                    <label for="village">
                        Village
                    </label>

                    <div class="input-box">

                        <i class="ri-map-pin-line"></i>

                        <input
                            type="text"
                            id="village"
                            placeholder="Enter village"
                            autocomplete="off"
                            required>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton">

                    <i class="ri-check-line"></i>

                    <span>Submit</span>

                </button>

            </form>


            <!-- SUCCESS MESSAGE -->

            <div
                id="successMessage"
                class="success-message">

                <i class="ri-checkbox-circle-fill"></i>

                <div>

                    <strong>
                        Submitted Successfully
                    </strong>

                    <p>
                        You can enter the next person's details.
                    </p>

                </div>

            </div>

        </section>


        <!-- VIEW AREA -->

        <section
            id="viewSection"
            class="view-section"
            style="display:none;">

            <div class="view-heading">

                <div>

                    <span>SUBMISSIONS</span>

                    <h2>Submitted Details</h2>

                </div>

                <button
                    type="button"
                    id="closeView"
                    class="close-view">

                    <i class="ri-close-line"></i>

                </button>

            </div>


            <!-- SEARCH -->

            <div class="search-box">

                <i class="ri-search-line"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name, phone or village">

            </div>


            <!-- LIST -->

            <div
                id="submissionList"
                class="submission-list">

            </div>


            <div
                id="noSubmissions"
                class="no-submissions"
                style="display:none;">

                <i class="ri-inbox-line"></i>

                <strong>
                    No submissions found
                </strong>

                <p>
                    Submitted entries will appear here.
                </p>

            </div>

        </section>

    </main>

</div>


<script
    type="module"
    src="submissions.js">
</script>

</body>

  </html>
